[project]
name = "fflies"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "asyncio>=3.4.3",
    "cartopy>=0.21.0",
    "dask>=2024.1.0",
    "geoviews>=1.12.0",
    "holoviews>=1.18.0",
    "ipykernel>=6.25.0",
    "jupyter-bokeh>=3.0.0",
    "matplotlib>=3.7.0",
    "pymc>=5.0.0",
    "requests>=2.28.0",
    "selenium>=4.10.0",
    "tabulate>=0.9.0",
    "virtualizarr>=1.0.0",
    "xarray[io]>=2023.1.0",
    "zarr>=2.16.0",
]

[project.scripts]
fflies-dashboard = "dashboard.dashboard:main"
fflies-SAFARIS = "fflies.main:main"


[tool.setuptools.packages.find]
include = ["fflies*", "dashboard*"] 

[tool.ruff]
exclude = ["archive", "docs", "tests", "*.ipynb"]
