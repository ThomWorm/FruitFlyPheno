
input:
  cache_path: "./cache"


weather:

  #data source - GRIDMET 
  source: "gridmet"
  #History years are the number of years of historical data to use for the model.
  history_years: 20
  #recent_buffer_deg is the number of degrees to buffer the recent data (in degrees Celsius).
  #dashboard_buffer_deg is the number of degrees to buffer the data for the dashboard (in degrees Celsius).
  #historical_buffer_deg is the number of degrees to buffer the historical data (
  recent_buffer_deg: 0.3
  dashboard_buffer_deg: 0.5
  historical_buffer_deg: 0.3
  gridmet_urls:
    - "http://thredds.northwestknowledge.net:8080/thredds/dodsC/agg_met_tmmx_1979_CurrentYear_CONUS.nc#fillmismatch"
    - "http://thredds.northwestknowledge.net:8080/thredds/dodsC/agg_met_tmmn_1979_CurrentYear_CONUS.nc#fillmismatch"
  cache_dir: "./cache/pred_cache.pkl"

fly_models:
  path: "./config/fly_models.json"

# config/settings.yaml
output:
  # Directory settings
  base_dir: "./results"  # All outputs go under this root
  subdirs:
    plots: "plots/{species}/{date}"  # Dynamic paths
    reports: "reports"
    json: "json_data"
  
  # Plot configuration
  plots:
    map:
      style: "seaborn-darkgrid"
      cmap: "viridis"
      dpi: 300
      formats: ["png", "pdf"]
    timeseries:
      figsize: [10, 6]
      rolling_mean: 7  # days
    
  # Report generation
  report:
    template: "templates/report.html"
    default_variables: ["F1", "F2", "F3"]
    summary_stats: ["mean", "min", "max"]
  
  # Data export
  data:
    json:
      indent: 2
      float_precision: 3
    netcdf:
      compression: True
      compression_level: 4
  
  # Notification settings
  notifications:
    email:
      enabled: False
      recipients: []
    logfile: "output_log.txt"